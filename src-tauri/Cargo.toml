[package]
name = "rs_flow_coding"
version = "0.2.1"
description = "按 APP 汇总 draw.io 流程图，颜色状态统计、实时编辑、加锁协作与历史对比"
authors = ["smallcat_SY"]
edition = "2021"
default-run = "rs_flow_coding"

[lib]
name = "rs_flow_coding_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "rs_flow_coding"
path = "src/main.rs"

[[bin]]
name = "flowctl"
path = "src/bin/flowctl.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = [] }
notify = "8"
roxmltree = "0.21"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2.5"
flate2 = "1"
base64 = "0.22"
percent-encoding = "2.3"
dunce = "1"
tauri-plugin-single-instance = "2"

[profile.release]
opt-level = "s"
lto = true
