<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Flow Coding</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside id="side">
    <header id="totals">
      <div class="total review" title="黄 起草待审 + 灰虚线 计划删除"><b id="t-user">0</b><span>待你审</span></div>
      <div class="total agent" title="红 有问题 + 蓝 想法 + 绿 已确认 + 绿虚线 确认删除"><b id="t-agent">0</b><span>待 Agent</span></div>
    </header>
    <div id="side-tools">
      <button id="btn-refresh" title="重新读取已知目录并统计">刷新</button>
      <button id="btn-rescan" title="遍历项目根，重新发现 docs/flow 与 docs/feat 目录">全量扫描</button>
      <button id="btn-roots" title="配置项目根目录">项目根</button>
    </div>
    <div id="legend"></div>
    <div id="tree"></div>
    <div id="side-msg"></div>
  </aside>

  <main id="main">
    <div id="panes">
      <!-- 流程图栏 -->
      <section id="flow-pane" class="pane">
        <div id="bar" class="pane-bar">
          <span id="cur-app"></span>
          <span id="cur-name">未打开流程图</span>
          <span id="cur-counts"></span>
          <span id="lock-badge"></span>
          <span id="save-state"></span>
          <span class="spacer"></span>
          <button id="btn-history" disabled>历史对比</button>
          <button id="btn-flow-close" title="关闭流程图栏">×</button>
        </div>
        <div id="node-bar" hidden>
          <span id="node-info"></span>
          <span class="spacer"></span>
          <button id="btn-tag" hidden></button>
        </div>
        <div id="editor-wrap">
          <iframe id="editor" title="draw.io"></iframe>
          <div id="readonly-mask" hidden><div>Agent 正在编辑，暂时只读<br><small id="mask-detail"></small></div></div>
          <div id="empty" class="empty">从左侧选择一张流程图或一个 Feat</div>
        </div>
      </section>

      <div id="splitter" hidden title="拖动调整宽度"></div>

      <!-- Feat 栏 -->
      <section id="feat-pane" class="pane" hidden>
        <div class="pane-bar">
          <span id="feat-id"></span>
          <span id="feat-title"></span>
          <span id="feat-status"></span>
          <span id="md-lock"></span>
          <span id="md-state"></span>
          <span class="spacer"></span>
          <button id="btn-ref" title="把流程图中选中的节点插入为引用（图名#节点id）">插入节点引用</button>
          <span id="md-modes"><button data-mode="edit">源码</button><button data-mode="split">分屏</button><button data-mode="preview">预览</button></span>
          <button id="btn-feat-close" title="关闭 Feat 栏">×</button>
        </div>
        <div id="feat-body">
          <div id="feat-side">
            <div class="fs-head" id="fs-head">关联节点 <b id="feat-node-count">0</b></div>
            <div id="feat-nodes"></div>
          </div>
          <div id="md-body" data-mode="split">
            <div id="md-editor"></div>
            <div id="md-preview" class="md"></div>
            <div id="md-mask" hidden><div>Agent 正在编辑档案，暂时只读</div></div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <section id="history" hidden>
    <header>
      <b>历史快照</b>
      <span class="hint">勾选两个版本对比（旧 → 新）</span>
      <span class="spacer"></span>
      <button id="btn-hist-view" disabled>查看所选旧版</button>
      <button id="btn-hist-restore" disabled>回滚到所选旧版</button>
      <button id="btn-hist-close">关闭</button>
    </header>
    <div id="hist-body">
      <table id="hist-table"><thead><tr><th></th><th>时间</th><th>来源</th><th>状态分布</th></tr></thead><tbody></tbody></table>
      <div id="diff"><div class="empty">选择两个快照查看差异</div></div>
    </div>
  </section>

  <div id="viewer" hidden>
    <header><b id="viewer-title">旧版查看（只读）</b><span class="spacer"></span><button id="btn-viewer-close">关闭</button></header>
    <iframe id="viewer-frame" title="旧版"></iframe>
  </div>

  <div id="roots-dlg" hidden>
    <div class="dlg">
      <b>项目根目录（每行一个）</b>
      <textarea id="roots-text" rows="6" spellcheck="false"></textarea>
      <div class="dlg-btns"><button id="roots-cancel">取消</button><button id="roots-ok">保存并扫描</button></div>
    </div>
  </div>

  <script src="vendor/vendor.js"></script>
  <script src="app.js"></script>
  <script src="feat.js"></script>
</body>
</html>
